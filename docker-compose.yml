services:
  postgres:
    image: postgres:16
    container_name: rescuesync-postgres
    environment:
      POSTGRES_USER: rescuesync
      POSTGRES_PASSWORD: rescuesync
      POSTGRES_DB: rescuesync
    ports:
      - "5440:5432"
    volumes:
      - rescuesync_pg16:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rescuesync -d rescuesync"]
      interval: 5s
      timeout: 5s
      retries: 10

  sistema_nacional:
    build:
      context: ./sistema_nacional
      target: dev
    environment:
      PORT: "3001"
      # Dentro de la red de compose la base se llama `postgres` y escucha en 5432.
      DATABASE_URL: postgresql://rescuesync:rescuesync@postgres:5432/rescuesync?schema=sistema_nacional
      JWT_SECRET: ${SN_JWT_SECRET:-dev-secret-cambiar-en-produccion}
      ADMIN_EMAIL: ${SN_ADMIN_EMAIL:-admin@rescuesync.local}
      ADMIN_PASSWORD: ${SN_ADMIN_PASSWORD:-admin1234}
    ports:
      - "3001:3001"
    develop:
      watch:
        - path: ./sistema_nacional
          action: sync
          target: /app
          ignore:
            - node_modules
            - dist
            - src/generated
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rescuesync_pg16:
